name: Heeler
options:
  bundleIdPrefix: TME.Kelpie
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

settings:
  base:
    # Swift 6 language mode implies complete strict concurrency checking.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 8JQWBQKEXX
    CODE_SIGN_STYLE: Automatic

packages:
  # Repository-local package owning the libssh2/OpenSSL implementation and
  # checked-in native artifacts. The one SSH backend (ADR 0011).
  HeelerSSH:
    path: Packages/HeelerSSH
  # Pinned to the reviewed libghostty-spm commit 7e45d27 (release 1.6.20260909),
  # which carries the public sendMousePos(x:y:modifiers:) Kelpie used to patch in,
  # so no local patch remains.
  # Kelpie: vendored copy of that commit under Packages/GhosttyTerminal with the
  # prebuilt libghostty (release tag upstream.82938b633ba6, sha256
  # 2d9a26e80c3836c450f03ea2cf9d191841d9093d4f61c1cea466d2fc8e215dbb) placed
  # locally by scripts/fetch-ghostty-artifact.sh, because the remote binary
  # download stalls in Xcode's downloader on some networks.
  GhosttyTerminal:
    path: Packages/GhosttyTerminal

targets:
  Heeler:
    type: application
    platform: iOS
    # The built product is Kelpie.app (see PRODUCT_NAME below); without this
    # the generated scheme's BuildableName reverts to Heeler.app and Run/Test
    # from Xcode look for a product that is never built.
    productName: Kelpie
    sources:
      - path: Sources/Heeler
        excludes:
          # Bundled as a folder reference below so notice files stay under
          # Notices/ in the app bundle rather than flattening to the root.
          - Resources/Notices
          # Local StoreKit testing only, wired into the Heeler scheme's run
          # action below. Never a bundle resource: the App Store, not a
          # checked-in file, is what prices the tips in a shipped build.
          - Kelpie.storekit
      # Notification code shared with the service extension: envelope
      # decryption, Notification Key store, alert renderer (ADR 0008).
      - Sources/HeelerNotificationCore
      # Live Activity attributes + details envelope (shared with HeelerWidgets).
      - Sources/HeelerActivityCore
      # Widget views double-included so Xcode can host their #Preview gallery
      # in the app target (plain previews are unsupported inside app-extension
      # targets); the @main WidgetBundle stays extension-only.
      - Sources/HeelerWidgets/AgentLiveActivityWidget.swift
      - Sources/HeelerWidgets/AgentActivityDecryptor.swift
      # Audited third-party notices + inventory.json (#161). Folder reference
      # preserves the Notices/ subdirectory the catalogue resolves against.
      - path: Sources/Heeler/Resources/Notices
        type: folder
        buildPhase: resources
    info:
      path: Sources/Heeler/Info.plist
      properties:
        # XcodeGen would otherwise hardcode 1.0/1 here, and a file value wins
        # over the generated one; keep both versions on the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Kelpie is one window. The root screen is herdr's own client on a
        # single Attach channel, and a Transport serves one Attach at a time,
        # so a second scene would build a second client that competes for it.
        # Declared here rather than left to the generated manifest: this also
        # makes SwiftUI's `supportsMultipleWindows` false, which is what gates
        # upstream's "Open in New Window" item and the Console row window drag.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Kept although no drag can create a window any more: `AgentRoute`
        # still builds and continues this activity type (ContentView's
        # `onContinueUserActivity`), and an undeclared type is never delivered.
        NSUserActivityTypes:
          - dev.bybee.heeler.agent
    entitlements:
      path: Sources/Heeler/Heeler.entitlements
      properties:
        # Development here covers Debug/local device builds (sandbox APNs);
        # App Store / TestFlight re-signing flips it to production, so the
        # APNs environment follows the build configuration (#71).
        aps-environment: development
        # Shared with the Notification Service Extension; doubles as the
        # Keychain access group holding the Notification Keys.
        com.apple.security.application-groups:
          - group.TME.Kelpie.shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: TME.Kelpie
        # Product/display name is rebranded to Kelpie; the module name stays
        # Heeler so Swift sources and imports keep working unchanged.
        PRODUCT_NAME: Kelpie
        PRODUCT_MODULE_NAME: Heeler
        # Home-screen name; the App Store listing is "Kelpie for herdr".
        INFOPLIST_KEY_CFBundleDisplayName: Kelpie
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        # Scan to Pair (#62) reads the Pairing Code QR from the computer screen.
        INFOPLIST_KEY_NSCameraUsageDescription: "Kelpie uses the camera to scan the Pairing Code shown on your computer, so you can add that machine without typing anything."
        # A Host reached by a .local/mDNS name or a LAN address makes iOS ask
        # for local-network access; without this key the connection is denied
        # with no prompt.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kelpie connects to your computer over SSH, which may be on your local network."
        # Only exempt encryption is used (standard SSH algorithms via the
        # HeelerSSH package's libssh2/OpenSSL, OS-provided CryptoKit);
        # declaring it here keeps every TestFlight upload from stalling on the
        # Missing Compliance prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Universal. herdr switches itself to a single-column mobile layout at
        # 64 columns or fewer, so the phone's root screen is herdr's own doing
        # and not a second design; App Store Connect derives device support
        # from the build, so this line is what makes the listing universal.
        TARGETED_DEVICE_FAMILY: "1,2"
        # And not on the Mac or Vision App Stores either: "Designed for iPad"
        # would ship this iPad-shaped TUI onto two platforms nobody has run it
        # on. Opt out explicitly rather than leaving Apple's default.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPadOS only offers Split View, Slide Over and free Stage Manager
        # resizing to apps that declare all four orientations — three of them
        # is what pinned the window to one shape. Declared for the iPad only,
        # so the iPhone keeps its three (upside-down on a phone is nobody's
        # intent). `UIRequiresFullScreen` is deliberately absent: setting it
        # would opt straight back out of multitasking.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # ActivityKit starts Live Activities from the app; HeelerWidgets renders them.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # Required for trackpad/mouse (indirect input) support on iPad.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    dependencies:
      - package: HeelerSSH
      - package: GhosttyTerminal
      - package: GhosttyTerminal
        product: GhosttyTheme
      - target: HeelerNotificationService
      - target: HeelerWidgets

  # Decrypts Agent Notifications before display (ADR 0008, #71). A thin
  # shell: the logic lives in HeelerNotificationCore, tested from the app
  # suite. The extension cannot link the app, so the shared sources (and the
  # few app files they lean on) are compiled in directly.
  HeelerNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - Sources/HeelerNotificationService
      - Sources/HeelerNotificationCore
      - Sources/Heeler/Support/Base64URL.swift
      - Sources/Heeler/Transport/SecretStore.swift
      # For AgentStatus; Foundation-only by construction (JSONValue is the
      # generated file's one in-repo dependency).
      - Sources/Heeler/Transport/Generated/HerdrAPITypes.swift
      - Sources/Heeler/Transport/JSONValue.swift
    entitlements:
      path: Sources/HeelerNotificationService/HeelerNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.TME.Kelpie.shared
    info:
      path: Sources/HeelerNotificationService/Info.plist
      properties:
        # An app extension's versions must match its containing app's, or
        # App Store validation rejects the bundle. XcodeGen would otherwise
        # hardcode its own 1.0/1 defaults here; point at the build settings
        # so both bundles stay in lockstep.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App Store validation (code 90360) requires a display name on
        # every embedded appex; never user-visible for this extension.
        CFBundleDisplayName: Kelpie Notification Service
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: TME.Kelpie.NotificationService
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        # Match the containing app's universal device family.
        TARGETED_DEVICE_FAMILY: "1,2"

  # Lock-screen / Dynamic Island Live Activity (docs/agents/live-activity-contract.md).
  # Thin WidgetKit shell: attributes, envelope open, and Notification Key
  # selection live in HeelerActivityCore / HeelerNotificationCore, compiled
  # in the same way as the notification service extension (the appex cannot
  # link the app). @main is the WidgetBundle; there is no principal class.
  HeelerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/HeelerWidgets
      - Sources/HeelerActivityCore
      - Sources/HeelerNotificationCore
      - Sources/Heeler/Support/Base64URL.swift
      - Sources/Heeler/Transport/SecretStore.swift
      # For AgentStatus; Foundation-only by construction (JSONValue is the
      # generated file's one in-repo dependency). NotificationEnvelope in
      # HeelerNotificationCore needs it.
      - Sources/Heeler/Transport/Generated/HerdrAPITypes.swift
      - Sources/Heeler/Transport/JSONValue.swift
      # Shared with the app Console; single hex owner for status colors (#247).
      - Sources/Heeler/Console/AgentStatusPalette.swift
    entitlements:
      path: Sources/HeelerWidgets/HeelerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.TME.Kelpie.shared
    info:
      path: Sources/HeelerWidgets/Info.plist
      properties:
        # An app extension's versions must match its containing app's, or
        # App Store validation rejects the bundle. XcodeGen would otherwise
        # hardcode its own 1.0/1 defaults here; point at the build settings
        # so both bundles stay in lockstep.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App Store validation (code 90360) requires a display name on
        # every embedded appex. Also the counts-only lock-screen fallback.
        CFBundleDisplayName: Kelpie
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: TME.Kelpie.Widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        # Match the containing app's universal device family.
        TARGETED_DEVICE_FAMILY: "1,2"

  HeelerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HeelerTests
      # Shared Pairing Code vectors (ADR 0007): the same file the Node plugin
      # tests consume, bundled so the Swift tests cannot drift from it.
      - path: plugin/test-vectors/pairing-code-v1.json
        buildPhase: resources
      # Shared notification envelope vectors (ADR 0008), same arrangement.
      - path: plugin/test-vectors/notification-payload-v1.json
        buildPhase: resources
      # Shared Live Activity details envelope vectors, same arrangement.
      - path: plugin/test-vectors/live-activity-content-v1.json
        buildPhase: resources
      # Shared sidebar layout snapshot vectors, consumed by Node and Swift.
      - path: plugin/test-vectors/sidebar-layout-v1.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: TME.Kelpie.tests
        # The host app's product is Kelpie.app (PRODUCT_NAME) while the target
        # stays Heeler; XcodeGen derives TEST_HOST from the target name.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kelpie.app/Kelpie"
    dependencies:
      - target: Heeler
      - package: HeelerSSH
      - package: GhosttyTerminal

  # UI-automation lane (docs/guides/driving-the-ipad.md). Not a behaviour
  # suite: its one test is a *driver* that replays a `;`-separated step
  # script handed in through KELPIE_DRIVE_STEPS and attaches a screenshot
  # after every step, so an agent can drive the physical iPad and read back
  # what the screen did. Deliberately excluded from `make test` and CI (the
  # Heeler scheme lists it skipped); scripts/drive-ipad.sh runs it through
  # the HeelerUIDrive scheme instead.
  HeelerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/HeelerUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: TME.Kelpie.uitests
        # The runner app is installed beside Kelpie on the device; same family.
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 8JQWBQKEXX
        # UI tests launch the app rather than hosting it, so this is
        # TEST_TARGET_NAME (the target, not the Kelpie.app product path).
        TEST_TARGET_NAME: Heeler
    dependencies:
      - target: Heeler

schemes:
  Heeler:
    build:
      targets:
        Heeler: all
    test:
      targets:
        - HeelerTests
        # Present so Xcode's Test navigator can run a driver by hand, but
        # skipped so `xcodebuild test -scheme Heeler` (make test, and the CI
        # lane in .github/workflows/ci.yml) never launches it on a simulator.
        # scripts/drive-ipad.sh uses the HeelerUIDrive scheme below.
        - name: HeelerUITests
          skipped: true
      # The only variable the app test process needs from the invoking shell.
      # The fixture itself arrives through the Simulator's launchd environment
      # as HEELER_SSH_E2E_CONFIG / HEELER_SSH_JUMP_E2E_CONFIG /
      # HEELER_PAIRING_E2E_CONFIG, which must stay off this list: an entry here
      # is forwarded unconditionally, substituting an empty string when the
      # shell has not exported it, and would shadow the launchd value.
      environmentVariables:
        HEELER_SSH_E2E_REQUIRED: $(HEELER_SSH_E2E_REQUIRED)
    run:
      config: Debug
      # Local tip-jar testing without App Store Connect products. Xcode reads
      # this only for Run; it is excluded from the app target's sources above
      # so it never reaches the bundle.
      storeKitConfiguration: Sources/Heeler/Kelpie.storekit

  # The UI-automation lane's own scheme: test action runs ONLY the driver
  # bundle, so nothing that says `-scheme Heeler` can pick it up.
  HeelerUIDrive:
    build:
      targets:
        Heeler: all
        HeelerUITests: [test]
    test:
      config: Debug
      targets:
        - HeelerUITests
      # The step script. A UI-test runner on the device inherits nothing from
      # the invoking shell, so the scheme has to forward it: xcodebuild
      # substitutes $(KELPIE_DRIVE_STEPS) from its own environment (an empty
      # string when unset, which the driver fails on with a clear message).
      environmentVariables:
        KELPIE_DRIVE_STEPS: $(KELPIE_DRIVE_STEPS)
