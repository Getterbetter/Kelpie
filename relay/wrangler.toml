# Cloudflare Workers deployment for the herdr Push Relay (ADR 0008).
#
# Non-secret config goes in [vars]; the APNs signing key is a deploy-time
# secret and must NEVER be committed:
#
#   wrangler secret put APNS_KEY_P8   # paste the .p8 PEM contents
#
# See README.md for the full deploy walkthrough.

name = "kelpie-apns"
main = "src/worker.js"
compatibility_date = "2026-07-01"
# Kelpie's relay lives on the free workers.dev address; Anthony has no
# Cloudflare zone, so there is no custom domain to route.
workers_dev = true

[vars]
APNS_TEAM_ID = "8JQWBQKEXX"
APNS_KEY_ID = "TODO-create-an-APNs-key-in-the-developer-portal"
APNS_TOPIC = "TME.Kelpie"
# Live Activity pushes use `${APNS_TOPIC}.push-type.liveactivity`
# (suffix-derived; no extra var).
# RATE_LIMIT_IP_PER_MIN = "120"                  # optional override
# RATE_LIMIT_TOKEN_PER_MIN = "60"                # optional override
