# Cloudflare Workers deployment for the herdr Push Relay (ADR 0008).
#
# Non-secret config goes in [vars]; the APNs signing key is a deploy-time
# secret and must NEVER be committed:
#
#   wrangler secret put APNS_KEY_P8   # paste the .p8 PEM contents
#
# See README.md for the full deploy walkthrough.

name = "kelpie-apns"
main = "src/worker.js"
compatibility_date = "2026-07-01"
workers_dev = false

# TODO(app-store): bybee.dev is the upstream Heeler developer's domain.
# Replace this hostname with Anthony's own before deploying the Kelpie relay.
[[routes]]
pattern = "kelpie-apns.bybee.dev"
custom_domain = true

# Transitional. A herdr server whose plugin predates the rename still posts to
# the old hostname, and the app wrote that hostname into its notify.json, so
# dropping it here would silence notifications until every deployment is
# updated. The updated plugin rewrites the URL on its next read; remove this
# route once no deployment is left on the old name.
[[routes]]
pattern = "herdr-apns.bybee.dev"
custom_domain = true

[vars]
APNS_TEAM_ID = "8JQWBQKEXX"
APNS_KEY_ID = "TODO-create-an-APNs-key-in-the-developer-portal"
APNS_TOPIC = "TME.Kelpie"
# Live Activity pushes use `${APNS_TOPIC}.push-type.liveactivity`
# (suffix-derived; no extra var).
# RATE_LIMIT_IP_PER_MIN = "120"                  # optional override
# RATE_LIMIT_TOKEN_PER_MIN = "60"                # optional override
